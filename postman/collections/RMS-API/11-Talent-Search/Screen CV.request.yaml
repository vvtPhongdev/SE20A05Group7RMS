$kind: http-request
name: Screen CV
method: POST
url: '{{baseUrl}}/api/v1/cv/{{candidateProfileId}}/screen'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "roleId": "{{roleId}}"
    }
description: Screen a candidate CV against a role
