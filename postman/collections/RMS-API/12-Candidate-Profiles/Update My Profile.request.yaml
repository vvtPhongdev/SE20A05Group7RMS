$kind: http-request
name: Update My Profile
method: PATCH
url: '{{baseUrl}}/api/v1/candidate-profiles/me'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "summary": "Experienced developer",
      "skills": ["JavaScript", "TypeScript"]
    }
description: Update the current candidate's profile
