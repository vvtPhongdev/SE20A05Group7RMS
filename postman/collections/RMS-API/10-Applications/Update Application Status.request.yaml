$kind: http-request
name: Update Application Status
method: PATCH
url: '{{baseUrl}}/api/v1/applications/{{applicationId}}/status'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "SHORTLISTED"
    }
description: Update application status (e.g. SHORTLISTED, REJECTED)
