$kind: http-request
name: Reset Password
method: POST
url: '{{baseUrl}}/api/v1/auth/reset-password'
order: 8000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "otp": "123456",
      "newPassword": "NewPassword123!"
    }
description: Reset password using OTP
