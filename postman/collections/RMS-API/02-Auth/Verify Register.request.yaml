$kind: http-request
name: Verify Register
method: POST
url: '{{baseUrl}}/api/v1/auth/verify-register'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "otp": "123456"
    }
description: Verify registration with OTP
