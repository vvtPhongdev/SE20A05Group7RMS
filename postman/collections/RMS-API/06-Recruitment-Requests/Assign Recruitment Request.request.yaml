$kind: http-request
name: Assign Recruitment Request
method: PATCH
url: '{{baseUrl}}/api/v1/recruitment-requests/{{requestId}}/assign'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "assigneeId": "{{userId}}"
    }
description: Assign recruitment request to a user
