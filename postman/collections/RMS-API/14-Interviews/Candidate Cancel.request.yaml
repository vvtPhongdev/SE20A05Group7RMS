$kind: http-request
name: Candidate Cancel
method: PATCH
url: '{{baseUrl}}/api/v1/interviews/schedules/{{scheduleId}}/candidate-cancel'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "No longer interested"
    }
description: Candidate cancels an interview
