# Deploy separately: fly deploy --config fly.embedding.toml
# Set a unique app name before the first deploy.
app = "se20a05-group7-rms-embedding"
primary_region = "sin"

[build]
  dockerfile = "docker/Dockerfile.embedding"

[env]
  NODE_ENV = "production"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "performance-1x"
  memory = "2048"
