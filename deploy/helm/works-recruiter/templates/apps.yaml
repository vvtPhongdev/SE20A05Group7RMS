{{- range $name, $service := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ default 1 $service.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ required "global.imageRegistry is required" $.Values.global.imageRegistry }}/{{ $name }}:{{ $.Values.global.imageTag }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          {{- if $service.port }}
          ports:
            - name: app
              containerPort: {{ $service.port }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            {{- range $key, $value := $service.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ $.Values.global.runtimeSecretName }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{- if $service.port }}
          readinessProbe:
            tcpSocket:
              port: app
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: app
            initialDelaySeconds: 15
          {{- end }}
{{- if $service.service }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: {{ if $service.public }}LoadBalancer{{ else }}ClusterIP{{ end }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: app
      port: {{ $service.port }}
      targetPort: app
{{- end }}
{{- end }}
